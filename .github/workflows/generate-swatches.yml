name: Generate color swatches

on:
  push:
    branches: [main]
    paths:
      - themes/**
  workflow_dispatch:

# Write access is granted only to the job that commits
permissions:
  contents: read

# Keyed on the branch rather than the ref, so two pushes in quick succession do
# not race to commit the same files.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Generate swatches
        uses: andornaut/color-swatches-action@main
        with:
          files: "themes/*.json"
          format: "png"
          out-dir: "swatches"
