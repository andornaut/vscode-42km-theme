name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The theme files are the whole of what this repository ships, and vsce
      # packages them without reading them, so a trailing comma or a stray
      # brace would reach the marketplace as a theme no editor can load.
      # Strict JSON, not JSONC: VS Code would accept comments in a theme, and
      # nothing here uses them, so the stricter parser is the one to check with.
      - name: Check that every theme file is valid JSON
        run: |
          set -euo pipefail
          for f in themes/*.json; do
            echo "$f"
            python3 -m json.tool "$f" >/dev/null
          done

      # The swatches the README links are generated from the theme files and
      # committed, so they can drift from what the themes say. Checked here
      # rather than regenerated by a workflow that commits: a push to main from
      # a workflow cannot satisfy the checks this branch requires, so the
      # swatches arrive with the change that moved them. `npm run swatches`
      # regenerates them.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Staged rather than diffed against the worktree, so a colour added to a
      # theme counts: its swatch is a new file, and an unstaged diff does not
      # see one.
      - name: Check that the swatches match the themes
        run: |
          set -euo pipefail
          npm run swatches
          git add -A -- swatches/
          if ! git diff --cached --quiet -- swatches/; then
            echo "::error::swatches/ is out of date; run 'npm run swatches' and commit the result"
            git diff --cached --stat -- swatches/
            exit 1
          fi
